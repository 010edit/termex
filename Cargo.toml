[workspace]
resolver = "2"
# The legacy Tauri/Vue desktop stack was physically removed in v0.80.0.
# This workspace contains only the shared Rust core, the Flutter bridge,
# and the remote daemon.
members = [
    "crates/termex-core",
    "crates/termex-flutter-bridge",
    "crates/termexd",
]
# `termex-core-private` is an optional path dependency for commercial
# builds. Excluding it keeps `cargo metadata` from treating the stub as a
# workspace member.
exclude = ["crates/termex-core-private"]

[workspace.dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
thiserror    = "2"
uuid         = { version = "1", features = ["v4"] }
anyhow       = "1"
log          = "0.4"
async-trait  = "0.1"
zeroize      = { version = "1", features = ["zeroize_derive"] }
tempfile     = "3"
termex-core  = { path = "crates/termex-core" }
