name: termex_bridge
description: FRB-generated Dart bindings for termex-core. Stubs used before codegen runs.
version: 0.34.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Keep in lockstep with the codegen pin and app/pubspec.yaml. A newer
  # runtime makes the generated-file header drift from the checked-in
  # bindings and fails the CI drift check.
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^2.4.0
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.7.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
