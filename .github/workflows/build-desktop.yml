name: Build Desktop (Linux + Windows)

# Fast CI build for the two desktop targets that do not need Apple signing.
# Produces unsigned, runnable bundles; signed installers are produced by
# release.yml on v* tags.
#
# Triggers:
#   - manual (Actions -> Run workflow)
#   - push to main touching app / packages / crates
#   - pull requests touching the same paths
#
# Artifacts:
#   termex-linux-x64    -> Termex-<version>-linux-x64.tar.gz    (+ .sha256)
#   termex-windows-x64  -> Termex-<version>-windows-x64.zip     (+ .sha256)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flutter_rust_bridge.yaml"
      - "scripts/frb-codegen.sh"
      - ".github/workflows/build-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "packages/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flutter_rust_bridge.yaml"
      - "scripts/frb-codegen.sh"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.x"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ── Linux x64 ────────────────────────────────────────────────────────────
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # GTK + keyring (Secret Service) + tray indicator + SQLCipher headers.
      # `liblzma-dev` is required by the Flutter Linux toolchain.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsqlcipher-dev libsecret-1-dev \
            libayatana-appindicator3-dev libdbus-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Read app version
        run: |
          VERSION=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' app/pubspec.yaml)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Termex $VERSION for linux-x64"

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      # Cargokit builds termex_flutter_bridge via cargo during this step.
      - name: Build Linux bundle
        working-directory: app
        run: flutter build linux --release

      - name: Package artifact
        run: |
          BUNDLE="app/build/linux/x64/release/bundle"
          test -x "$BUNDLE/termex"
          mkdir -p dist

          ARCHIVE_NAME="Termex-${VERSION}-linux-x64.tar.gz"
          tar -C "$BUNDLE" -czf "dist/$ARCHIVE_NAME" .
          (cd dist && sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256")

          echo "### Linux artifact" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: termex-linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ── Windows x64 ──────────────────────────────────────────────────────────
  windows:
    name: Windows x64
    # Pinned: windows-latest now ships Visual Studio 18, which Flutter 3.35
    # does not recognise. windows-2022 keeps the VS 2022 C++ toolchain.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # rusqlite uses bundled SQLCipher with vendored OpenSSL; provide the
      # static OpenSSL build that the release pipeline also uses.
      - name: Install OpenSSL (vcpkg)
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Read app version
        shell: pwsh
        run: |
          $line = Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([^+ ]+)' |
            Select-Object -First 1
          if (-not $line) { throw "version not found in app/pubspec.yaml" }

          $version = $line.Matches.Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building Termex $version for windows-x64"

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      # Cargokit builds termex_flutter_bridge via cargo during this step.
      - name: Build Windows bundle
        working-directory: app
        run: flutter build windows --release

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Bundle = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path "$Bundle/termex.exe")) {
            throw "termex.exe not found at $Bundle"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $Archive = "dist/Termex-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "$Bundle/*" -DestinationPath $Archive -Force

          $Hash = (Get-FileHash $Archive -Algorithm SHA256).Hash.ToLower()
          "$Hash  $(Split-Path $Archive -Leaf)" |
            Out-File -FilePath "$Archive.sha256" -Encoding ascii

          "### Windows artifact" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem dist | Format-Table Name, Length |
            Out-String | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: termex-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
