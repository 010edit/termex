name: CI

# Fast desktop CI: Flutter analysis/tests, Rust workspace tests, and the
# FRB codegen drift check.
#
# iOS/Android compile smoke tests live in mobile-ci.yml and run only when
# mobile-relevant paths change (or manually / weekly). Keeping them out of
# this workflow means documentation, CI, and desktop-only changes do not
# pay for a macOS runner and a full Android NDK build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Flutter pub get (app)
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze (app)
        working-directory: app
        run: flutter analyze

      - name: Flutter pub get (shared)
        working-directory: packages/termex_shared
        run: flutter pub get

      - name: Flutter analyze (shared)
        working-directory: packages/termex_shared
        run: flutter analyze

  rust-test:
    name: Rust Workspace Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies for rusqlite / sqlcipher
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev pkg-config libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        # Workspace cache covers termex-core + termex-flutter-bridge + termexd.
        with:
          workspaces: . -> target

      - name: cargo test --workspace
        run: cargo test --workspace --release

  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Flutter unit tests
        working-directory: app
        run: flutter test

      - name: Run Flutter benchmarks
        working-directory: app
        run: flutter test benchmark/

      - name: Check ARB completeness
        run: bash scripts/check-arb-completeness.sh

  frb-codegen-check:
    # v0.79.43: verifies the committed FRB bindings match what fresh
    # codegen would emit. Replaces the same logic that previously ran on
    # macos-15 inside ios-bootstrap-check — Linux runners are ~10x
    # cheaper per minute, and the check is platform-independent (the
    # FRB codegen reads pure Rust source, writes pure Dart + Rust
    # output). Without this guard, an enum / signature change on the
    # Rust side can land on main with stale Dart bindings and only
    # surface at iOS / Android build time on a contributor's machine —
    # exactly the v0.79.35 incident that triggered this safeguard.
    name: FRB Codegen Drift Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Codegen builds the bridge crate, which pulls keyring -> Secret
      # Service -> libdbus-sys. Same headers the rust-test job needs.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev pkg-config libdbus-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/termex-flutter-bridge

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Cache flutter_rust_bridge_codegen binary
        id: frb-codegen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          # Keep this key in sync with the exact version below. A cached
          # binary under an older key can otherwise silently be 2.13.x and
          # rewrite every generated file header (the v0.80 drift incident).
          key: frb-codegen-${{ runner.os }}-v2.12.0-exact

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb-codegen-cache.outputs.cache-hit != 'true'
        # Exact pin: the Dart runtime is pinned to flutter_rust_bridge 2.12.0
        # (app/pubspec.yaml). `^2.12` now resolves to 2.13.x, which changes
        # the generated-file header and fails the drift check.
        run: cargo install flutter_rust_bridge_codegen --version '=2.12.0' --locked

      - name: Verify codegen version
        # Guard against a stale cache entry that does not match the pin.
        run: |
          flutter_rust_bridge_codegen --version
          flutter_rust_bridge_codegen --version | grep -q '2\.12\.0'

      - name: Verify FRB bindings are up-to-date
        run: ./scripts/frb-codegen.sh --check
